version: 2

project_name: koma

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X 'github.com/yukiteruamano/koma/constant.BuiltAt={{ .Date }}'
      - -X 'github.com/yukiteruamano/koma/constant.BuiltBy={{ .Env.USER }}'
      - -X 'github.com/yukiteruamano/koma/constant.Revision={{ .ShortCommit }}'
      - -s
      - -w

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}Darwin
      {{- else if eq .Os "linux" }}Linux
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - completions/*
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Dependency updates
      regexp: "^.*feat\\(deps\\)*:+.*$"
      order: 300
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: 'Documentation updates'
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999
  filters:
    exclude:
      - '^test'
      - '^chore'
      - '^refactor'
      - '^build'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy

dockers:
  - goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-amd64"
    dockerfile: Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/yukiteruamano/koma"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
    skip_push: false
  - goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-arm64"
    dockerfile: Dockerfile.release
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/yukiteruamano/koma"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .ShortCommit }}"
    skip_push: false

docker_manifests:
  - name_template: "ghcr.io/yukiteruamano/koma:latest"
    image_templates:
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-amd64"
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-arm64"
    skip_push: false
  - name_template: "ghcr.io/yukiteruamano/koma:{{ .Tag }}"
    image_templates:
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-amd64"
      - "ghcr.io/yukiteruamano/koma:{{ .Tag }}-arm64"
    skip_push: false

release:
  github:
    owner: yukiteruamano
    name: koma

  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## What's new?

  footer: |

    **Full Changelog**: https://github.com/yukiteruamano/koma/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    Bugs? Suggestions? [Open an issue](https://github.com/yukiteruamano/koma/issues/new/choose)

nfpms:
  - file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/yukiteruamano/koma
    maintainer: yukiteruamano
    description: |-
      The most advanced cli manga downloader in the entire universe!

    license: MIT
    formats:
      - deb
      - rpm

    bindir: /usr/local/bin
    section: utils

    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

    contents:
      - src: ./completions/koma.bash
        dst: /usr/share/bash-completion/completions/koma
        file_info:
          mode: 0644
      - src: ./completions/koma.fish
        dst: /usr/share/fish/completions/koma.fish
        file_info:
          mode: 0644
      - src: ./completions/koma.zsh
        dst: /usr/share/zsh/vendor-completions/_koma
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/koma/copyright
        file_info:
          mode: 0644
